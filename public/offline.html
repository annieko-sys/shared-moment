<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff5f7">
  <title>Offline · Shared Moment</title>
  <style>
    @font-face{font-family:Jua;src:url('/fonts/jua.ttf') format('truetype');font-display:swap}
    @font-face{font-family:Yaldevi;src:url('/fonts/yaldevi-regular.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}html{background:#fff5f7}body{margin:0;min-height:100dvh;background:#fff5f7;color:#62565b;font:15px/1.3 Yaldevi,system-ui,sans-serif}
    header{height:56px;border-bottom:1px solid #ded5d8;display:flex;align-items:center;gap:12px;padding:0 17px;font:15px Jua,system-ui,sans-serif}
    .logo{width:27px;height:27px;border-radius:9px;background:#e99584;display:grid;place-items:center;transform:rotate(-18deg)}.logo img{width:19px;height:20px;transform:rotate(18deg)}
    main{width:min(100%,402px);margin:auto;padding:134px 47px 70px}.mark{width:150px;height:150px;border-radius:17px;background:#e8ddf2;display:grid;place-items:center;margin:0 auto 45px}.mark img{width:40px;height:43px}
    h1{font:30px/1.1 Jua,system-ui,sans-serif;margin:0 0 24px}p{margin:0 0 83px;font:15px/20px Yaldevi,system-ui,sans-serif}
    a{display:flex;align-items:center;min-height:55px;padding:0 21px;border-radius:17px;background:#fff0cf;color:#62565b;text-decoration:none;font:17px Jua,system-ui,sans-serif}a:focus-visible{outline:3px solid #674191;outline-offset:3px}
    @media(max-width:360px){main{padding-inline:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header><span class="logo" aria-hidden="true"><img src="/figma/home/imgHeart.svg" alt=""></span>Shared Moment</header>
  <main><div class="mark" aria-hidden="true"><img src="/figma/pages/imgAboutHeart.svg" alt=""></div><h1>You’re offline</h1><p>Shared Moment needs a connection to load this page. Reconnect and try again. Nothing you did here is waiting to be sent.</p><a href="/">Try Shared Moment again&nbsp; →</a></main>
</body>
</html>
